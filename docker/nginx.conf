# Buổi 8: NGINX vừa phục vụ giao diện React, vừa reverse proxy /api tới các bản API.
# "api" là tên service trong docker-compose; có 2 bản thì DNS của Docker trả 2 IP và NGINX chia tải luân phiên.
# Chống dò mật khẩu, lớp 1: mỗi IP tối đa 20 yêu cầu/phút vào /api/auth/ (lớp 2, 3 nằm trong backend, làm ở module TaiKhoan).
limit_req_zone $binary_remote_addr zone=dang_nhap:10m rate=20r/m;
limit_req_status 429;

upstream api_backend {
    server api:8080;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 6m;
    proxy_read_timeout 60s;
    root /usr/share/nginx/html;

    # Khi chạy sau NGINX của VPS (HTTPS), $remote_addr là IP cổng Docker, không phải IP người dùng.
    # Lấy IP thật từ header X-Real-IP, chỉ tin header khi đến từ máy chủ / mạng Docker.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    location /api/auth/ {
        limit_req zone=dang_nhap burst=5 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # ghi đè, không nối header khách tự gửi (chống giả IP)
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SignalR (thông báo thời gian thực, dùng từ module ThongBao / TimXe) cần nâng cấp WebSocket
    location /hub/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /swagger {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # Tệp JS/CSS do Vite build có mã băm trong tên (index-AbC123.js): đổi nội dung là đổi tên, nên cho trình duyệt giữ lâu
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router: mọi đường dẫn khác trả về index.html. index.html KHÔNG được lưu đệm,
    # nếu không trình duyệt sẽ hiện bản giao diện cũ (cùng địa chỉ localhost:8080) cho tới khi bấm tải lại.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
