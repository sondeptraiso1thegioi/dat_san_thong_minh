<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2100" viewBox="0 0 2800 2100" role="img" aria-labelledby="title description">
<title id="title">Kiến trúc hệ thống đặt sân thể thao thông minh</title>
<desc id="description">Ba vai trò dùng ứng dụng Expo, kết nối backend ASP.NET Core theo tầng, SQL Server, MinIO, PaymentGateway giả lập, bản đồ, Open-Meteo và LLM tùy chọn. Đây là kiến trúc mục tiêu; hiện đã có đăng nhập và hồ sơ phiên kết nối database thật.</desc>
